        :root {
            --portfolio-filters-bottom: clamp(16px, 4vw, 40px);
        }

        body.has-draggable-portfolio {
            overflow: hidden !important;
            height: 100vh !important;
            width: 100vw !important;
        }

        .index-header {
            z-index: 103 !important;
        }

        .index-menu-overlay {
            z-index: 102 !important;

        /* Light mode viewport background */
        .portfolio-viewport {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background-color: #ffffff;
            z-index: 5;
            cursor: grab;
            user-select: none;
            -webkit-user-select: none;
            transition: background-color 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .portfolio-viewport.grabbing {
            cursor: grabbing;
        }

        /* Light mode canvas background */
        .portfolio-canvas {
            position: absolute;
            width: 3800px;
            height: 2700px;
            top: 0;
            left: 0;
            will-change: transform;
            background: transparent;
            transition: background 0.5s ease;
            z-index: 2;
        }

        .viewport-grain {
            animation: grain 8s steps(10) infinite;
            background-image: url("https://assets.website-files.com/5dff182dc3faab4c98b08388/5dff21c5e65e0610a8d38b86_noisy-texture-100x100-o5-d10-c-FFFFFA-t1.png");
            content: "";
            height: 300%;
            left: -50%;
            position: fixed;
            top: -100%;
            width: 300%;
            pointer-events: none;
            z-index: 1;
        }

        /* Dark mode overrides for viewport and canvas */
        body.dark .portfolio-viewport {
            background-color: #000000;
        }

        body.dark .portfolio-canvas {
            background: transparent;
        }

        .portfolio-card {
            position: absolute;
            width: 380px;
            height: 380px;
            border-radius: 110px;
            clip-path: inset(0 round 110px);
            display: flex;
            align-items: center;
            justify-content: center;
            box-sizing: border-box;
            transition: opacity 0.8s cubic-bezier(0.16, 1, 0.3, 1), transform 0.5s cubic-bezier(0.16, 1, 0.3, 1), left 0.6s cubic-bezier(0.16, 1, 0.3, 1), top 0.6s cubic-bezier(0.16, 1, 0.3, 1);
            overflow: hidden;
            background: transparent !important;
        }

        .portfolio-card a {
            display: block;
            width: 100%;
            height: 100%;
        }

        .portfolio-card .post-image {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        .portfolio-card .post-image img,
        .portfolio-card .post-image video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            draggable: false;
            pointer-events: none;
        }

        .portfolio-card.hidden-filter {
            opacity: 0.05;
            pointer-events: none !important;
        }

        /* Floating Overlays - Light Mode styles */
        .portfolio-filters-overlay {
            position: fixed;
            bottom: var(--portfolio-filters-bottom);
            left: 50%;
            transform: translateX(-50%);
            z-index: 100;
        }

        .portfolio-filters-overlay .works-filter {
            margin: 0 !important;
            display: flex;
            flex-wrap: nowrap !important;
            gap: 8px;
            background: #ebebeb !important;
            padding: 6px;
            border-radius: 40px;
            border: 1px solid rgba(0, 0, 0, 0.35) !important;
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.03) !important;
            white-space: nowrap;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            /* Momentum scrolling on iOS */
            max-width: calc(100vw - 80px);
            -ms-overflow-style: none;
            /* IE/Edge */
            scrollbar-width: none;
            /* Firefox */
            cursor: grab;
        }

        .portfolio-filters-overlay .works-filter::-webkit-scrollbar {
            display: none;
            /* Safari/Chrome */
        }

        @media (max-width: 720px) {
            .portfolio-filters-overlay .works-filter {
                max-width: calc(100vw - 40px);
            }
        }

        .portfolio-filters-overlay .filter-btn {

            border: 1px solid transparent !important;

        }

        .portfolio-filters-overlay .filter-btn.active {

    <script>
        document.addEventListener('DOMContentLoaded', function () {
            // Add scroll-lock class to body
            document.body.classList.add('has-draggable-portfolio');

            const viewport = document.getElementById('portfolio-viewport');
            const canvas = document.getElementById('portfolio-canvas');
            const cards = document.querySelectorAll('.portfolio-card');
            const buttons = document.querySelectorAll('.filter-btn');

            // Generate stable randomized indices once on load to prevent reshuffling on window resize
            const shuffledIndices = Array.from({ length: cards.length }, (_, i) => i);
            for (let i = shuffledIndices.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [shuffledIndices[i], shuffledIndices[j]] = [shuffledIndices[j], shuffledIndices[i]];
            }


            // Get reference to the bottom info overlay elements
            const infoOverlay = document.getElementById('portfolio-info-overlay');
            const infoTitle = document.getElementById('info-title');
            const infoCategory = document.getElementById('info-category');

            let isDragging = false;
            let isPointerDown = false;
            let startX = 0, startY = 0;
            let currentX = 0, currentY = 0;
            let targetX = 0, targetY = 0;
            let velocityX = 0, velocityY = 0;
            let lastMouseX = 0, lastMouseY = 0;
            let lastTime = 0;
            let rafId = null;

            let downX = 0, downY = 0;
            let hasDragged = false;

            // Dimensions of the canvas area (mutable for responsive updates)
            let canvasWidth = 3325;
            let canvasHeight = 1834;

            const calculateLayout = () => {
                const activeBtn = document.querySelector('.filter-btn.active');
                const filter = activeBtn ? activeBtn.getAttribute('data-filter') : 'all';
                const isFiltered = filter !== 'all';

                const isMobile = window.innerWidth < 576;
                const isTablet = window.innerWidth >= 576 && window.innerWidth <= 1024;
                const colsPerRow = (isMobile || isTablet) ? 4 : 5;

                // Count visible cards
                let visibleCount = 0;
                cards.forEach(card => {
                    const cat = card.getAttribute('data-category');
                    if (!isFiltered || cat === filter) {
                        visibleCount++;
                    }
                });

                const rowsCount = Math.ceil(visibleCount / colsPerRow);

                // Base dimensions at reference scale
                const baseCardSize = 380;
                const baseCardGap = 57;
                const baseStep = baseCardSize + baseCardGap;
                const baseCanvasHeight = 120 * 2 + rowsCount * baseStep - baseCardGap;

                // Scale to cover both viewport width and height
                const scaleX = window.innerWidth / 1920;
                const scaleY = window.innerHeight / baseCanvasHeight;
                let scale = Math.max(0.45, scaleX, scaleY);
                if (isMobile) {
                    scale = Math.max(0.55, scale);
                } else if (isTablet) {
                    scale = Math.max(0.75, scale);
                } else {
                    scale = scale * 1.05;
                }

                const cardSize = baseCardSize * scale;
                const cardGap = baseCardGap * scale;

                // Spacing calculations to match about & contact page layout padding
                const w = window.innerWidth;
                const h = window.innerHeight;
                let marginX, marginTop, marginBottom;

                if (w > 1024) {
                    // Desktop
                    marginX = 40;
                    marginTop = Math.max(100, Math.min(h * 0.12, 140));
                } else if (w > 720) {
                    // Tablet
                    marginX = 40;
                    marginTop = Math.max(100, Math.min(h * 0.10, 120));
                } else {
                    // Mobile
                    marginX = Math.max(16, Math.min(w * 0.04, 30));
                    marginTop = Math.max(85, Math.min(h * 0.09, 100));
                }
                marginBottom = marginTop;

                const step = cardSize + cardGap;

                cards.forEach(card => {
                    card.style.width = cardSize + 'px';
                    card.style.height = cardSize + 'px';
                    const radius = (110 * scale) + 'px';
                    card.style.borderRadius = radius;
                    card.style.clipPath = `inset(0 round ${radius})`;
                });

                const positions = [];
                for (let i = 0; i < cards.length; i++) {
                    positions.push({
                        col: i % colsPerRow,
                        row: Math.floor(i / colsPerRow)
                    });
                }

                let visibleIndex = 0;
                cards.forEach((card, idx) => {
                    const cat = card.getAttribute('data-category');
                    const isVisible = !isFiltered || cat === filter;

                    if (isVisible) {
                        card.style.display = 'flex';
                        // If filtered, show sequentially (visibleIndex). If unfiltered, show randomized.
                        const posIndex = isFiltered ? visibleIndex : shuffledIndices[idx];
                        const pos = positions[posIndex];
                        const left = marginX + pos.col * step;
                        const top = marginTop + pos.row * step;
                        card.style.left = left + 'px';
                        card.style.top = top + 'px';
                        visibleIndex++;
                    } else {
                        card.style.display = 'none';
                    }
                });

                canvasWidth = marginX * 2 + (visibleCount > 0 ? Math.min(visibleCount, colsPerRow) : 0) * step - cardGap;
                canvasHeight = marginTop + marginBottom + rowsCount * step - cardGap;
            };

            const getMinMax = () => {
                return {
                    minX: window.innerWidth - canvasWidth,
                    maxX: 0,
                    minY: window.innerHeight - canvasHeight,
                    maxY: 0
                };
            };

            const updateTransform = () => {
                canvas.style.transform = `translate3d(${currentX}px, ${currentY}px, 0)`;

                const centerX = window.innerWidth / 2;
                const centerY = window.innerHeight / 2;

                cards.forEach(card => {
                    const rect = card.getBoundingClientRect();
                    const cardCenterX = rect.left + rect.width / 2;
                    const cardCenterY = rect.top + rect.height / 2;

                    // Offset image in opposite direction to create 3D depth/parallax
                    const offsetX = (cardCenterX - centerX) * -0.07;
                    const offsetY = (cardCenterY - centerY) * -0.07;

                    const media = card.querySelector('.post-image img, .post-image video');
                    if (media) {
                        media.style.transform = `translate3d(${offsetX}px, ${offsetY}px, 0) scale(1.3)`;
                    }

                });
            };

            // Start the view at the top-left (0, 0) so the first card is fully visible on load
            const initPosition = () => {
                targetX = 0;
                targetY = 0;
                currentX = targetX;
                currentY = targetY;
                updateTransform();
            };

            const onMouseDown = (e) => {
                const isTouch = e.type === 'touchstart';
                isPointerDown = true;
                if (!isTouch) {
                    isDragging = true;
                    infoOverlay.classList.remove('visible');
                }
                viewport.classList.add('grabbing');
                const pageX = e.pageX || (e.touches && e.touches[0].pageX);
                const pageY = e.pageY || (e.touches && e.touches[0].pageY);
                if (pageX === undefined || pageY === undefined) return;
                startX = pageX - targetX;
                startY = pageY - targetY;
                downX = pageX;
                downY = pageY;
                lastMouseX = pageX;
                lastMouseY = pageY;
                lastTime = Date.now();
                velocityX = 0;
                velocityY = 0;
                hasDragged = false;
                if (rafId) cancelAnimationFrame(rafId);
            };

            const onMouseMove = (e) => {
                const isTouch = e.type === 'touchmove';
                if (isTouch && !isPointerDown) return;
                if (!isDragging && isTouch) {
                    isDragging = true;
                    infoOverlay.classList.remove('visible');
                }
                if (!isDragging) return;
                const pageX = e.pageX || (e.touches && e.touches[0].pageX);
                const pageY = e.pageY || (e.touches && e.touches[0].pageY);
                if (pageX === undefined || pageY === undefined) return;

                const newTargetX = pageX - startX;
                const newTargetY = pageY - startY;

                // Boundary constraints with resistance (rubber band effect)
                const bounds = getMinMax();
                let x = newTargetX;
                let y = newTargetY;

                if (x > bounds.maxX) x = bounds.maxX + (x - bounds.maxX) * 0.3;
                if (x < bounds.minX) x = bounds.minX + (x - bounds.minX) * 0.3;
                if (y > bounds.maxY) y = bounds.maxY + (y - bounds.maxY) * 0.3;
                if (y < bounds.minY) y = bounds.minY + (y - bounds.minY) * 0.3;

                targetX = x;
                targetY = y;

                // Calculate velocity
                const now = Date.now();
                const dt = now - lastTime;
                if (dt > 0) {
                    velocityX = (pageX - lastMouseX) / dt * 16;
                    velocityY = (pageY - lastMouseY) / dt * 16;
                }
                lastMouseX = pageX;
                lastMouseY = pageY;
                lastTime = now;

                currentX = targetX;
                currentY = targetY;
                updateTransform();
            };

            const onMouseUp = (e) => {
                isPointerDown = false;
                viewport.classList.remove('grabbing');
                if (!isDragging) return;
                isDragging = false;

                const pageX = e.pageX || (e.changedTouches && e.changedTouches[0].pageX);
                const pageY = e.pageY || (e.changedTouches && e.changedTouches[0].pageY);
                if (pageX !== undefined && pageY !== undefined) {
                    const dist = Math.sqrt((pageX - downX) * (pageX - downX) + (pageY - downY) * (pageY - downY));
                    if (dist > 5) {
                        hasDragged = true;
                    }
                }

                // Inertia tick
                tick();
            };

            const tick = () => {
                if (isDragging) return;

                // Apply inertia friction
                targetX += velocityX;
                targetY += velocityY;
                velocityX *= 0.93;
                velocityY *= 0.93;

                // Bound snapping
                const bounds = getMinMax();
                let snapBack = false;

                if (targetX > bounds.maxX) {
                    targetX += (bounds.maxX - targetX) * 0.15;
                    snapBack = true;
                } else if (targetX < bounds.minX) {
                    targetX += (bounds.minX - targetX) * 0.15;
                    snapBack = true;
                }

                if (targetY > bounds.maxY) {
                    targetY += (bounds.maxY - targetY) * 0.15;
                    snapBack = true;
                } else if (targetY < bounds.minY) {
                    targetY += (bounds.minY - targetY) * 0.15;
                    snapBack = true;
                }

                currentX += (targetX - currentX) * 0.15;
                currentY += (targetY - currentY) * 0.15;
                updateTransform();

                const speed = Math.sqrt(velocityX * velocityX + velocityY * velocityY);
                const distanceToTarget = Math.sqrt((targetX - currentX) * (targetX - currentX) + (targetY - currentY) * (targetY - currentY));

                if (speed > 0.05 || distanceToTarget > 0.05 || snapBack) {
                    rafId = requestAnimationFrame(tick);
                } else {
                    currentX = targetX;
                    currentY = targetY;
                    updateTransform();
                }
            };

            // Event Listeners for Dragging
            viewport.addEventListener('mousedown', onMouseDown);
            window.addEventListener('mousemove', onMouseMove);
            window.addEventListener('mouseup', onMouseUp);

            viewport.addEventListener('touchstart', onMouseDown, { passive: true });
            window.addEventListener('touchmove', onMouseMove, { passive: false });
            window.addEventListener('touchend', onMouseUp, { passive: true });

            // Prevent Touch Gestures from scrolling the page
            viewport.addEventListener('touchmove', function (e) {
                e.preventDefault();
            }, { passive: false });

            // Prevent link preview/drag behavior by dynamically removing href on mousedown/touchstart
            const links = document.querySelectorAll('.portfolio-card a');
            links.forEach(link => {
                link.addEventListener('mousedown', function (e) {
                    if (e.button !== 0) return; // Only prevent preview for left-click drags
                    const href = this.getAttribute('href');
                    if (href) {
                        this.setAttribute('data-temp-href', href);
                        this.removeAttribute('href');
                    }
                });

                link.addEventListener('touchstart', function () {
                    const href = this.getAttribute('href');
                    if (href) {
                        this.setAttribute('data-temp-href', href);
                        this.removeAttribute('href');
                    }
                }, { passive: true });

                const restoreHref = function () {
                    const tempHref = this.getAttribute('data-temp-href');
                    if (tempHref) {
                        this.setAttribute('href', tempHref);
                        this.removeAttribute('data-temp-href');
                    }
                };

                link.addEventListener('mouseup', restoreHref);
                link.addEventListener('touchend', restoreHref);
                link.addEventListener('mouseleave', restoreHref);

                link.addEventListener('click', function (e) {
                    restoreHref.call(this);
                    if (hasDragged) {
                        e.preventDefault();
                        e.stopPropagation();
                    }
                });
            });
            // Card hover info overlay logic
            let lastTouchTime = 0;
            const isTouchEventRecently = () => (Date.now() - lastTouchTime) < 1000;
            let touchStartX = 0;
            let touchStartY = 0;

            let overlayTimeout = null;
            let fadeOutTimeout = null;
            let currentActiveCard = null;
            let isOverlayActive = false;

            const updateOverlayText = (title, category) => {
                infoTitle.textContent = title;
                infoCategory.textContent = category;
            };

            const showOverlay = (card, title, category) => {
                currentActiveCard = card;

                if (overlayTimeout) {
                    clearTimeout(overlayTimeout);
                    overlayTimeout = null;
                }
                if (fadeOutTimeout) {
                    clearTimeout(fadeOutTimeout);
                    fadeOutTimeout = null;
                }

                if (isOverlayActive) {
                    // It is either visible or currently fading out.
                    // Force hide it first.
                    infoOverlay.classList.remove('visible');

                    // Wait for the exit animation to finish before showing the new text
                    overlayTimeout = setTimeout(() => {
                        if (currentActiveCard === card) {
                            updateOverlayText(title, category);
                            infoOverlay.classList.add('visible');
                            isOverlayActive = true;
                        }
                    }, 150); // 150ms matches the 0.15s parent ease fade out
                } else {
                    // It was completely hidden, show it immediately
                    updateOverlayText(title, category);
                    infoOverlay.classList.add('visible');
                    isOverlayActive = true;
                }
            };

            const hideOverlay = (card) => {
                if (!card || currentActiveCard === card) {
                    currentActiveCard = null;
                    if (overlayTimeout) {
                        clearTimeout(overlayTimeout);
                        overlayTimeout = null;
                    }
                    infoOverlay.classList.remove('visible');

                    if (fadeOutTimeout) {
                        clearTimeout(fadeOutTimeout);
                    }
                    fadeOutTimeout = setTimeout(() => {
                        isOverlayActive = false;
                    }, 150);
                }
            };

            cards.forEach(card => {
                card.addEventListener('mouseenter', function (e) {
                    if (isTouchEventRecently() || isDragging) return;
                    const title = this.getAttribute('data-title') || '';
                    const category = this.getAttribute('data-category-name') || '';
                    showOverlay(this, title, category);
                });

                card.addEventListener('mouseleave', function () {
                    hideOverlay(this);
                });

                card.addEventListener('mousedown', function () {
                    hideOverlay(null);
                });

                // Touch events for mobile/tablet devices
                card.addEventListener('touchstart', function (e) {
                    lastTouchTime = Date.now();
                    const touch = e.touches[0];
                    if (!touch) return;
                    touchStartX = touch.clientX;
                    touchStartY = touch.clientY;

                    if (isDragging) return;
                    const title = this.getAttribute('data-title') || '';
                    const category = this.getAttribute('data-category-name') || '';
                    showOverlay(this, title, category);
                }, { passive: true });

                card.addEventListener('touchmove', function (e) {
                    lastTouchTime = Date.now();
                    const touch = e.touches[0];
                    if (!touch) return;

                    // If they move their finger more than 10px, they are dragging/scrolling, so hide the overlay
                    if (Math.abs(touch.clientX - touchStartX) > 10 || Math.abs(touch.clientY - touchStartY) > 10) {
                        hideOverlay(null);
                    }
                }, { passive: true });

                card.addEventListener('touchend', function () {
                    lastTouchTime = Date.now();
                });

                card.addEventListener('touchcancel', function () {
                    lastTouchTime = Date.now();
                    hideOverlay(null);
                });
            });
            // Filter functionality
            buttons.forEach(btn => {
                btn.addEventListener('click', function (e) {
                    e.stopPropagation();
                    buttons.forEach(b => b.classList.remove('active'));
                    this.classList.add('active');

                    const filter = this.getAttribute('data-filter');

                    // Update URL with filter parameter
                    const url = new URL(window.location);
                    if (filter === 'all') {
                        url.searchParams.delete('filter');
                    } else {
                        url.searchParams.set('filter', filter);
                    }
                    window.history.pushState({}, '', url);

                    // Toggle filter-active-all class on viewport
                    if (filter === 'all') {
                        viewport.classList.add('filter-active-all');
                        infoOverlay.classList.remove('category-hidden');
                    } else {
                        viewport.classList.remove('filter-active-all');
                        infoOverlay.classList.add('category-hidden');
                    }

                    cards.forEach(card => {
                        const cat = card.getAttribute('data-category');
                        if (filter === 'all' || cat === filter) {
                            card.classList.remove('hidden-filter');
                        } else {
                            card.classList.add('hidden-filter');
                        }
                    });

                    calculateLayout();
                    initPosition();
                });
            });

            // Parse URL filter parameter if present to auto-trigger the category
            const urlParams = new URLSearchParams(window.location.search);
            const initialFilter = urlParams.get('filter');
            if (initialFilter) {
                const targetBtn = document.querySelector(`.filter-btn[data-filter="${initialFilter}"]`);
                if (targetBtn) {
                    targetBtn.click();
                }
            }

            // Handle initial layout and resize centering
            calculateLayout();
            initPosition();
            window.addEventListener('resize', () => {
                calculateLayout();
                const bounds = getMinMax();
                targetX = Math.max(bounds.minX, Math.min(bounds.maxX, targetX));
                targetY = Math.max(bounds.minY, Math.min(bounds.maxY, targetY));
                currentX = targetX;
                currentY = targetY;
                updateTransform();
            });

            // Desktop horizontal scrolling for the category filter
            const filterContainer = document.querySelector('.works-filter');
            if (filterContainer) {
                // 1. Convert vertical wheel scroll to horizontal
                filterContainer.addEventListener('wheel', (e) => {
                    if (e.deltaY !== 0) {
                        e.preventDefault();
                        filterContainer.scrollLeft += e.deltaY;
                    }
                }, { passive: false });

                // 2. Click-and-drag scrolling
                let isDragScroll = false;
                let startX, scrollLeft;
                let dragMoved = false;

                filterContainer.addEventListener('mousedown', (e) => {
                    isDragScroll = true;
                    dragMoved = false;
                    startX = e.pageX - filterContainer.offsetLeft;
                    scrollLeft = filterContainer.scrollLeft;
                    filterContainer.style.cursor = 'grabbing';
                });

                window.addEventListener('mouseup', () => {
                    if (isDragScroll) {
                        isDragScroll = false;
                        filterContainer.style.cursor = 'grab';
                    }
                });

                window.addEventListener('mousemove', (e) => {
                    if (!isDragScroll) return;
                    const x = e.pageX - filterContainer.offsetLeft;
                    const walk = (x - startX) * 1.5; // Drag speed multiplier
                    if (Math.abs(walk) > 5) {
                        dragMoved = true;
                        e.preventDefault();
                    }
                    filterContainer.scrollLeft = scrollLeft - walk;
                });

                // Prevent click triggers on buttons if dragged
                filterContainer.addEventListener('click', (e) => {
                    if (dragMoved) {
                        e.preventDefault();
                        e.stopPropagation();
                    }
                }, true);
            }
        });
    </script>

    <script>
        const themeToggleBtn = document.getElementById('theme-toggle');
        const body = document.body;

        const currentTheme = localStorage.getItem('theme');
        if (currentTheme === 'dark') {
            body.classList.add('dark');
            document.documentElement.classList.add('dark');
            themeToggleBtn.innerHTML = '<i class="fa-solid fa-sun"></i>';
        } else {
            themeToggleBtn.innerHTML = '<i class="fa-solid fa-moon"></i>';
        }

        themeToggleBtn.addEventListener('click', () => {
            body.classList.toggle('dark');
            document.documentElement.classList.toggle('dark');

            if (body.classList.contains('dark')) {
                localStorage.setItem('theme', 'dark');
                themeToggleBtn.innerHTML = '<i class="fa-solid fa-sun"></i>';
            } else {
                localStorage.setItem('theme', 'light');
                themeToggleBtn.innerHTML = '<i class="fa-solid fa-moon"></i>';
            }
        });

        // Custom Hamburger and Full-Page Overlay Menu Toggling with Scroll Lock
        const hamburgerBtn = document.getElementById('index-hamburger');
        const menuOverlay = document.getElementById('index-menu-overlay');
        const menuLinks = document.querySelectorAll('.index-menu-link');

        function preventDefault(e) {
            e.preventDefault();
        }

        const wheelOpt = { passive: false };
        const wheelEvent = 'onwheel' in document.createElement('div') ? 'wheel' : 'mousewheel';

        function openMenu() {
            hamburgerBtn.classList.add('is-active');
            menuOverlay.classList.add('is-open');
            body.classList.add('menu-open-lock');
            document.documentElement.classList.add('menu-open-lock');

            // Intercept scroll actions (mousewheel, touchmove, keys)
            window.addEventListener('DOMMouseScroll', preventDefault, false);
            window.addEventListener(wheelEvent, preventDefault, wheelOpt);
            window.addEventListener('touchmove', preventDefault, wheelOpt);
        }

        function closeMenu() {
            hamburgerBtn.classList.remove('is-active');
            menuOverlay.classList.remove('is-open');
            body.classList.remove('menu-open-lock');
            document.documentElement.classList.remove('menu-open-lock');

            // Restore standard scrolling
            window.removeEventListener('DOMMouseScroll', preventDefault, false);
            window.removeEventListener(wheelEvent, preventDefault, wheelOpt);
            window.removeEventListener('touchmove', preventDefault, wheelOpt);
        }

        function toggleMenu() {
            const isOpen = menuOverlay.classList.contains('is-open');
            if (isOpen) {
                closeMenu();
            } else {
                openMenu();
            }
        }

        hamburgerBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            toggleMenu();
        });

        // Close menu when a link is clicked
        menuLinks.forEach(link => {
            link.addEventListener('click', () => {
                closeMenu();
            });
        });




        // Close menu on Escape key press
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && menuOverlay.classList.contains('is-open')) {
                closeMenu();
            }
        });

        // Header scroll detection - hide on scroll down, show on scroll up
        const header = document.querySelector('.index-header');
        let lastScrollY = window.scrollY;

        window.addEventListener('scroll', () => {
            const currentScrollY = window.scrollY;

            if (currentScrollY > lastScrollY && currentScrollY > 50) {
                // Scrolling down - hide header
                header.classList.add('hidden');
            } else {
                // Scrolling up - show header
                header.classList.remove('hidden');
            }

            lastScrollY = currentScrollY;
        });
    </script>
    <script src="js/chatbot.js" defer></script>
