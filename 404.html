    <script src='https://draggabilly.desandro.com/draggabilly.pkgd.js'></script>

    <script>
        const themeToggleBtn = document.getElementById('theme-toggle');
        const body = document.body;

        const currentTheme = localStorage.getItem('theme');
        if (currentTheme === 'dark') {
            body.classList.add('dark');
            document.documentElement.classList.add('dark');
            themeToggleBtn.innerHTML = '<i class="fa-solid fa-sun"></i>';
        } else {
            themeToggleBtn.innerHTML = '<i class="fa-solid fa-moon"></i>';
        }

        themeToggleBtn.addEventListener('click', () => {
            body.classList.toggle('dark');
            document.documentElement.toggle('dark');

            if (body.classList.contains('dark')) {
                localStorage.setItem('theme', 'dark');
                themeToggleBtn.innerHTML = '<i class="fa-solid fa-sun"></i>';
            } else {
                localStorage.setItem('theme', 'light');
                themeToggleBtn.innerHTML = '<i class="fa-solid fa-moon"></i>';
            }
        });

        // Hamburger Toggling
        const hamburgerBtn = document.getElementById('index-hamburger');
        const menuOverlay = document.getElementById('index-menu-overlay');
        const menuLinks = document.querySelectorAll('.index-menu-link');

        function preventDefault(e) {
            e.preventDefault();
        }

        const wheelOpt = { passive: false };
        const wheelEvent = 'onwheel' in document.createElement('div') ? 'wheel' : 'mousewheel';

        function openMenu() {
            hamburgerBtn.classList.add('is-active');
            menuOverlay.classList.add('is-open');
            body.classList.add('menu-open-lock');
            document.documentElement.classList.add('menu-open-lock');

            window.addEventListener('DOMMouseScroll', preventDefault, false);
            window.addEventListener(wheelEvent, preventDefault, wheelOpt);
            window.addEventListener('touchmove', preventDefault, wheelOpt);
        }

        function closeMenu() {
            hamburgerBtn.classList.remove('is-active');
            menuOverlay.classList.remove('is-open');
            body.classList.remove('menu-open-lock');
            document.documentElement.classList.remove('menu-open-lock');

            window.removeEventListener('DOMMouseScroll', preventDefault, false);
            window.removeEventListener(wheelEvent, preventDefault, wheelOpt);
            window.removeEventListener('touchmove', preventDefault, wheelOpt);
        }

        hamburgerBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            if (menuOverlay.classList.contains('is-open')) {
                closeMenu();
            } else {
                openMenu();
            }
        });

        menuLinks.forEach(link => {
            link.addEventListener('click', () => {
                closeMenu();
            });
        });

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && menuOverlay.classList.contains('is-open')) {
                closeMenu();
            }
        });

        // Initialize Draggabilly for 404 items matching home page classes
        const draggables = ['.drag404-A', '.drag404-B', '.drag404-C', '.drag404-D', '.drag404-E', '.drag404-F'];
        draggables.forEach(selector => {
            const elem = document.querySelector(selector);
            if (elem) {
                new Draggabilly(elem, {
                    containment: '.creative-media-col .container'
                });
            }
        });

        // Prevent right-click context menu specifically on images
        document.addEventListener('contextmenu', (e) => {
            const isMeImg = e.target.classList.contains('center-me-img');
            if (isMeImg) {
                e.preventDefault();
            }
        });
    </script>
